<!--
  This file is required for Netlify Forms to work with Next.js SSR.
  Netlify's build process scans this file to detect form definitions.
  The actual form submission happens via JavaScript in the React components.
  See: https://docs.netlify.com/forms/setup/#forms-for-nextjs-or-ssr-frameworks
-->
<!DOCTYPE html>
<html>
<head>
  <title>Forms</title>
</head>
<body>
  <!-- Feedback Form Definition -->
  <form name="feedback" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="feedback" />
    <input name="bot-field" />
    <input name="feedback-type" />
    <input name="name" />
    <input name="email" />
    <textarea name="message"></textarea>
    <input name="page" />
    <input name="timestamp" />
  </form>
</body>
</html>
