# Netlify configuration for Bay Tremor
# Fixes stale cache issues and content encoding mismatches

[build]
  command = "npm run build"
  publish = ".next"

# Use Next.js Runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Custom headers to prevent stale cache issues
[[headers]]
  # OG Images - MUST be cached aggressively for fast social sharing
  # These are fetched by iMessage, Twitter, Facebook crawlers
  for = "/earthquake/*/opengraph-image"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  # Twitter Images - same aggressive caching
  for = "/earthquake/*/twitter-image"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400, stale-while-revalidate=604800"
    CDN-Cache-Control = "public, max-age=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  # HTML pages - short cache, must revalidate
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Prevent aggressive caching of HTML documents
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Static assets (JS/CSS chunks) - immutable, long cache
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Public static files (favicons, images)
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"# Disable Netlify's asset optimization to prevent encoding conflicts
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = false
  minify = false
[build.processing.js]
  bundle = false
  minify = false
[build.processing.html]
  pretty_urls = false
[build.processing.images]
  compress = true

# Scheduled function for real-time earthquake monitoring
# Runs every minute to check for new earthquakes and send push notifications
[functions]
  directory = "netlify/functions"

[functions."earthquake-monitor"]
  schedule = "* * * * *"
