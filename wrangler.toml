name = "sr-earthquakes"
main = "dist/_worker.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "dist"
binding = "ASSETS"

# ── Sprint 2: D1 (replace MongoDB) ────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "earthquake-tracker"
database_id = "d0b76a3b-6160-4c92-8b75-fa8aeff69741"
migrations_dir = "migrations"

# ── Sprint 2: KV Namespaces ───────────────────────────────────────────────────
[[kv_namespaces]]
binding = "EARTHQUAKE_KV"
id = "ba9db04d86074366bdf876150573c534"

[[kv_namespaces]]
binding = "FEATURE_FLAGS_KV"
id = "09a0d8a2f61f40889377a185c37ec0a5"

# ── Sprint 2: Durable Objects (replace Pusher) ────────────────────────────────
[[durable_objects.bindings]]
name = "EARTHQUAKE_ROOM"
class_name = "EarthquakeRoom"

[[durable_objects.bindings]]
name = "COMMENT_ROOM"
class_name = "CommentRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EarthquakeRoom", "CommentRoom"]

# ── Sprint 5: R2 (replace Cloudinary) ─────────────────────────────────────────
# Run `wrangler r2 bucket create earthquake-media` once before deploying.
[[r2_buckets]]
binding = "MEDIA_R2"
bucket_name = "earthquake-media"

# ── Historical earthquake dataset (15+ years of USGS data) ───────────────────
# Run `wrangler r2 bucket create earthquake-historical` once before deploying.
# Upload data with: npm run upload:historical
[[r2_buckets]]
binding = "HISTORICAL_R2"
bucket_name = "earthquake-historical"

# ── Sprint 4: Queues (async APNs dispatch) ────────────────────────────────────
# Run `wrangler queues create earthquake-notifications` once before deploying.
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "earthquake-notifications"

[[queues.consumers]]
queue = "earthquake-notifications"
max_batch_size = 50

# ── Sprint 4: Cron Trigger (USGS polling every 60s) ──────────────────────────
[triggers]
crons = ["*/1 * * * *"]

# ── Sprint 6: Analytics Engine ────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "earthquake_events"
